<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>
<style>
  html { scroll-behavior: smooth; font-size: 100%; }
  @media (min-width: 640px) {
    html { font-size: 125%; }
  }

  #progress-bar { transition: width 0.4s ease; }

  @keyframes pulse-dot { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .pulse-dot { animation: pulse-dot 1.4s infinite; display: inline-block; }
  .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
  .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

  #progress-step {
    transition: opacity 0.5s ease;
  }
  #progress-step.fading {
    opacity: 0;
  }

  #gauge-circle.gauge-loading {
    transition: none;
  }
  #gauge-circle {
    transition: stroke-dashoffset 1.8s cubic-bezier(0.22, 1.12, 0.4, 1);
  }

  [data-i18n], [data-i18n-placeholder] {
    transition: opacity 0.25s ease;
  }

  .lang-fading {
    opacity: 0;
  }

  body {
    background-color: #f8fafc;
    background-image:
      radial-gradient(circle at 8% 15%, rgba(251, 146, 60, 0.32), transparent 45%),
      radial-gradient(circle at 85% 8%, rgba(45, 212, 191, 0.36), transparent 48%),
      radial-gradient(circle at 75% 85%, rgba(45, 212, 191, 0.28), transparent 45%),
      radial-gradient(circle at 15% 90%, rgba(251, 146, 60, 0.28), transparent 45%);
    background-attachment: fixed;
  }

  [data-reveal] { opacity: 0; transform: translateY(14px); transition: opacity 0.55s ease, transform 0.55s ease; }
  [data-reveal].revealed { opacity: 1; transform: translateY(0); }

  #hero-text {
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    transform: translateY(14px);
  }

  /* Coin-flip entrance: the icon spins a few full turns around its own
     vertical axis while fading/settling in, landing back at a multiple
     of 360deg so it reads as "upright" once the spin finishes. Perspective
     lives on the grid parent so the rotation reads as real depth instead
     of a flat horizontal squish. */
  .hero-grid { perspective: 800px; }
  #hero-icon {
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    transform: translateY(14px) scale(0.94) rotateY(0deg);
  }
  #hero-icon.revealed { transform: translateY(0) scale(1) rotateY(1080deg); }
</style>
</head>
<body class="text-gray-900 min-h-screen">

  <!-- Hero: full-width landing section -->
  <header class="w-full bg-white/70 relative">
    <div class="absolute top-6 right-6 flex items-center gap-3">
      <a href="https://github.com/rfi-irfos/pass-the-bot" target="_blank" rel="noopener noreferrer"
         class="text-gray-500 hover:text-gray-900 transition" aria-label="GitHub repository">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.207 11.387.6.113.793-.26.793-.577 0-.285-.01-1.04-.016-2.04-3.338.725-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.809 1.304 3.495.997.108-.775.42-1.305.762-1.605-2.665-.303-5.467-1.332-5.467-5.93 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.652.242 2.873.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.61-2.807 5.624-5.48 5.921.43.372.823 1.102.823 2.222 0 1.604-.014 2.896-.014 3.29 0 .32.192.694.801.576C20.565 21.795 24 17.298 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <div class="inline-flex bg-white border border-gray-200 rounded-full p-1 shadow-sm text-base">
        <button type="button" id="lang-de" class="px-4 py-1.5 rounded-full font-medium transition-colors duration-300">DE</button>
        <button type="button" id="lang-en" class="px-4 py-1.5 rounded-full font-medium text-gray-400 transition-colors duration-300">EN</button>
      </div>
    </div>

    <div class="max-w-5xl mx-auto px-6 pt-20 pb-10 md:pt-14 md:pb-14">
      <div class="hero-grid grid md:grid-cols-2 gap-10 items-center">
        <div class="text-left" id="hero-text" data-reveal>
          <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold mb-4 tracking-tight">
            Pass The Bot<span class="text-green-600">!</span>
          </h1>
          <p class="text-xl font-semibold mb-4" data-i18n="tagline"></p>

          <div class="flex flex-wrap justify-start gap-2 text-sm">
            <span class="badge-pill bg-white border-2 border-green-600 text-green-700 rounded-full pl-2.5 pr-4 py-1.5 inline-flex items-center gap-1.5 font-medium whitespace-nowrap shadow-md">
              <svg width="16" height="16" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="#15803d"></circle><path d="M5 9.5 L7.5 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <span data-i18n="badgeFree"></span>
            </span>
            <span class="badge-pill bg-white border-2 border-blue-600 text-blue-700 rounded-full pl-2.5 pr-4 py-1.5 inline-flex items-center gap-1.5 font-medium whitespace-nowrap shadow-md">
              <svg width="16" height="16" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="#15803d"></circle><path d="M5 9.5 L7.5 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <span data-i18n="badgeNoAccount"></span>
            </span>
            <span class="badge-pill bg-white border-2 border-orange-500 text-orange-600 rounded-full pl-2.5 pr-4 py-1.5 inline-flex items-center gap-1.5 font-medium whitespace-nowrap shadow-md">
              <svg width="16" height="16" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9" fill="#15803d"></circle><path d="M5 9.5 L7.5 12 L13 6" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              <span data-i18n="badgeOpenSource"></span>
            </span>
          </div>
        </div>

        <div class="flex justify-center order-first md:order-last" id="hero-icon" data-reveal>
          <svg viewBox="0 0 280 280" class="w-40 h-40 sm:w-56 sm:h-56 md:w-[280px] md:h-[280px]"
            style="filter: drop-shadow(0 10px 8px rgba(0,0,0,0.18)) drop-shadow(0 20px 35px rgba(0,0,0,0.22));">
            <circle cx="140" cy="140" r="130" fill="#2563eb"></circle>
            <path d="M140 10 A130 130 0 0 1 140 270 L140 140 Z" fill="#1e40af"></path>
            <g transform="translate(78, 55)">
              <path d="M0 20 L0 150 L124 150 L124 40 L104 20 Z" fill="#ffffff"></path>
              <path d="M104 20 L104 40 L124 40 Z" fill="#bfdbfe"></path>
              <text x="20" y="42" font-size="30" font-weight="bold" fill="#16a34a">CV</text>
              <rect x="20" y="65" width="70" height="8" rx="4" fill="#dbeafe"></rect>
              <rect x="20" y="85" width="84" height="8" rx="4" fill="#dbeafe"></rect>
              <rect x="20" y="105" width="60" height="8" rx="4" fill="#dbeafe"></rect>
            </g>
            <circle cx="196" cy="196" r="58" fill="#16a34a"></circle>
            <path d="M196 138 A58 58 0 0 1 196 254 Z" fill="#15803d"></path>
            <path d="M170 196 L189 215 L226 178" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <div class="relative w-full" style="background-color: #fefbf6;">
    <div class="absolute inset-x-0 top-0 w-full bg-no-repeat pointer-events-none"
      style="background-image: url('bg-lower.png'); background-size: 100% 100%; background-position: top center; aspect-ratio: 1672 / 941;
        mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);"></div>

    <main class="relative w-full max-w-4xl mx-auto px-6 py-12">

    <!-- Single expanding app card: form on top, results grow in below -->
    <div class="relative bg-white border border-gray-200 rounded-2xl shadow-xl mb-8 overflow-hidden">
    <button type="button" id="info-btn" aria-label="What is an ATS?"
      class="absolute top-4 right-4 z-10 w-10 h-10 rounded-full bg-amber-50 border border-amber-200 shadow-lg flex items-center justify-center text-amber-500 hover:text-amber-600 hover:bg-amber-100 transition">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M9 21h6M10 18h4M12 3a6 6 0 0 0-3.5 10.9c.5.36.8.95.8 1.6v.5h5.4v-.5c0-.65.3-1.24.8-1.6A6 6 0 0 0 12 3Z"
          stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(251,191,36,0.15)"/>
      </svg>
    </button>
    <form id="check-form" class="p-8">
      <div class="grid md:grid-cols-2 gap-6">
        <div>
          <label for="posting_text" class="block text-center text-lg font-semibold mb-3" data-i18n="labelPosting"></label>
          <div class="relative h-32">
            <textarea id="posting_text" name="posting_text" required
              class="relative z-10 w-full h-32 bg-transparent border border-gray-300 rounded-lg p-4 text-base focus:outline-none focus:ring-2 focus:ring-black resize-none"></textarea>
            <div id="posting-placeholder"
              class="absolute inset-0 flex items-center justify-center text-center text-base text-gray-400 px-6 pointer-events-none"
              data-i18n="placeholderPosting"></div>
          </div>
        </div>

        <div>
          <label for="resume_file" class="block text-center text-lg font-semibold mb-3" data-i18n="labelCv"></label>
          <div class="relative border-2 border-dashed border-gray-300 rounded-lg h-32 flex flex-col items-center justify-center text-center p-4">
            <div id="file-name-display" class="text-sm text-gray-600 px-2 truncate max-w-full flex flex-col items-center gap-1">
              <svg width="28" height="28" viewBox="0 0 28 28" class="mb-1">
                <circle cx="14" cy="14" r="13" fill="none" stroke="#9ca3af" stroke-width="1.5"></circle>
                <path d="M14 8 V20 M8 14 H20" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"></path>
              </svg>
              <span data-i18n="fileHint"></span>
              <span class="text-gray-400" data-i18n="fileTypes"></span>
            </div>
            <input type="file" id="resume_file" name="resume_file" accept=".pdf,.docx" required
              class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn"
        class="w-full mt-6 bg-green-800 hover:bg-green-900 text-white rounded-lg py-4 text-lg font-semibold transition flex items-center justify-center gap-2">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="8.5" cy="8.5" r="6" stroke="#ffffff" stroke-width="2"></circle>
          <path d="M13.5 13.5 L18 18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <span id="submit-btn-label" data-i18n="analyzeBtn"></span>
        <span id="submit-btn-dots" class="hidden ml-0.5">
          <span class="pulse-dot">.</span><span class="pulse-dot">.</span><span class="pulse-dot">.</span>
        </span>
      </button>

      <div id="progress-wrap" class="hidden mt-4">
        <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="bg-green-700 h-2 rounded-full" style="width: 0%"></div>
        </div>
        <div id="progress-step" class="mt-3 text-center">
          <p id="progress-step-title" class="text-base font-semibold text-gray-900"></p>
          <p id="progress-step-subtitle" class="text-sm text-gray-500 mt-0.5"></p>
        </div>
      </div>

      <div id="error-box" class="hidden mt-4 p-4 rounded-lg bg-red-50 text-red-800 border border-red-200"></div>
    </form>

    <!-- Results grow inside the same card (skeleton until real data loads) -->
    <div id="results-card" class="border-t border-gray-100 p-8 opacity-40" style="transition: opacity 0.5s ease;">
      <div class="flex flex-col md:flex-row items-center gap-8 mb-8 revealed" data-reveal>
        <svg width="140" height="140" viewBox="0 0 140 140" class="shrink-0">
          <circle cx="70" cy="70" r="60" fill="none" stroke="#e5e7eb" stroke-width="12"></circle>
          <circle id="gauge-circle" cx="70" cy="70" r="60" fill="none" stroke="#16a34a" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377"
            transform="rotate(-90 70 70)"></circle>
          <text id="gauge-text" x="70" y="75" text-anchor="middle" font-size="26" font-weight="bold" fill="#111827">·</text>
        </svg>
        <div>
          <h2 class="text-lg font-semibold mb-1" data-i18n="atsResultHeading"></h2>
          <p id="score-summary" class="text-gray-500 mb-4" data-i18n="scorePrompt"></p>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-4 mb-8 revealed" data-reveal>
        <section class="bg-green-50 border border-green-100 rounded-xl p-4">
          <h3 class="font-semibold text-green-800 mb-3 flex items-center justify-between">
            <span data-i18n="matchedHeading"></span>
            <span id="count-matched" class="text-xs font-bold bg-green-600 text-white rounded-full min-w-[1.5rem] text-center px-2 py-0.5">0</span>
          </h3>
          <ul id="matched-list" class="space-y-1 text-sm"></ul>
        </section>
        <section class="bg-amber-50 border border-amber-100 rounded-xl p-4">
          <h3 class="font-semibold text-amber-800 mb-3 flex items-center justify-between">
            <span data-i18n="nearMissHeading"></span>
            <span id="count-nearmiss" class="text-xs font-bold bg-amber-500 text-white rounded-full min-w-[1.5rem] text-center px-2 py-0.5">0</span>
          </h3>
          <ul id="nearmiss-list" class="space-y-1 text-sm"></ul>
        </section>
        <section class="bg-red-50 border border-red-100 rounded-xl p-4">
          <h3 class="font-semibold text-red-800 mb-3 flex items-center justify-between">
            <span data-i18n="missingHeading"></span>
            <span id="count-missing" class="text-xs font-bold bg-red-600 text-white rounded-full min-w-[1.5rem] text-center px-2 py-0.5">0</span>
          </h3>
          <ul id="missing-list" class="space-y-1 text-sm"></ul>
        </section>
      </div>

      <div class="grid md:grid-cols-[1fr_1fr_1.15fr] gap-4 mb-8 revealed" data-reveal>
        <section class="bg-white border border-gray-200 rounded-xl p-4">
          <h3 class="font-semibold mb-3" data-i18n="keywordCoverageHeading"></h3>
          <div class="space-y-3 text-sm">
            <div>
              <div class="flex justify-between mb-1">
                <span data-i18n="exactMatchLabel"></span>
                <span id="exact-match-count"></span>
              </div>
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div id="exact-match-bar" class="bg-green-600 h-2 rounded-full" style="width: 0%"></div>
              </div>
            </div>
            <div>
              <div class="flex justify-between mb-1">
                <span data-i18n="semanticMatchLabel"></span>
                <span id="semantic-match-count"></span>
              </div>
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div id="semantic-match-bar" class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
              </div>
            </div>
            <div id="open-match-row" class="hidden">
              <div class="flex justify-between mb-1">
                <span data-i18n="openMatchLabel"></span>
                <span id="open-match-count"></span>
              </div>
              <div class="w-full bg-gray-100 rounded-full h-2">
                <div id="open-match-bar" class="bg-teal-600 h-2 rounded-full" style="width: 0%"></div>
              </div>
            </div>
          </div>
          <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
            <span class="text-xs font-medium text-gray-500" data-i18n="totalKeywordsLabel"></span>
            <span id="total-keyword-count" class="text-sm font-bold text-gray-900"></span>
          </div>
        </section>
        <section class="bg-white border border-gray-200 rounded-xl p-4" id="section-analysis-card">
          <h3 class="font-semibold mb-3" data-i18n="sectionAnalysisHeading"></h3>
          <ul id="section-analysis-list" class="space-y-2 text-sm"></ul>
        </section>
        <section class="bg-white border border-gray-200 rounded-xl p-4" id="radar-card">
          <h3 class="font-semibold mb-3" data-i18n="radarHeading"></h3>
          <div id="radar-container" class="relative mx-auto" style="width: 230px; height: 230px;">
            <svg viewBox="0 0 230 230" width="230" height="230">
              <g id="radar-rings"></g>
              <g id="radar-spokes"></g>
              <polygon id="radar-polygon" points="" fill="rgba(22,163,74,0.55)" stroke="#15803d" stroke-width="3" stroke-linejoin="round"></polygon>
              <g id="radar-dots"></g>
            </svg>
            <div id="radar-labels" class="absolute inset-0 pointer-events-none"></div>
          </div>
        </section>
      </div>

      <div id="tips-section" class="revealed" data-reveal>
        <h3 class="font-semibold mb-3" data-i18n="tipsHeading"></h3>
        <ul id="tips-list" class="space-y-2 text-sm"></ul>
      </div>

      <div class="flex justify-end mt-6 revealed" data-reveal>
        <button type="button" id="download-report-btn"
          class="hidden shrink-0 bg-green-700 hover:bg-green-800 text-white text-sm font-semibold rounded-lg px-4 py-2.5 items-center gap-2 shadow-sm transition">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5M4 15v1a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span data-i18n="downloadReportBtn"></span>
        </button>
      </div>
    </div>

    </main>

  <!-- Info modal: what is an ATS and why this tool exists -->
  <div id="info-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div id="info-modal-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl max-w-5xl w-full max-h-[95vh] overflow-y-auto p-6 md:p-8">
      <button type="button" id="info-modal-close" aria-label="Close"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition z-10">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="md:flex md:gap-8">
        <div class="hidden md:flex md:flex-col md:justify-between md:w-56 lg:w-64 flex-shrink-0">
          <div class="bg-blue-50 rounded-xl px-3.5 py-2 flex items-center gap-2.5">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="flex-shrink-0">
              <path d="M4 8h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="#2563eb" stroke-width="1.8"/>
              <path d="M9 8V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" stroke="#2563eb" stroke-width="1.8"/>
            </svg>
            <span class="text-sm font-bold text-gray-900" data-i18n="pipelineStep1"></span>
          </div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="mx-auto my-0.5"><path d="M12 4v14m0 0-5-5m5 5 5-5" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <div class="bg-emerald-50 rounded-xl px-3.5 py-2 flex items-center gap-2.5">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="flex-shrink-0">
              <path d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="#059669" stroke-width="1.8"/>
              <path d="M9 12h6M9 16h6" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="text-sm font-bold text-gray-900" data-i18n="pipelineStep2"></span>
          </div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" class="mx-auto my-0.5"><path d="M12 4v14m0 0-5-5m5 5 5-5" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
