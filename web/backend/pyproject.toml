[project]
name = "passthebot-web-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    # Fetches job postings from pasted links (app/fetch_posting.py): needs
    # per-hop redirect control, streamed size limits and timeouts.
    "httpx>=0.27",
    # passthebot itself is NOT listed here: a relative `file://../..` URI is
    # not portable across platforms/pip versions (hit a real
    # "non-local file URIs are not supported" error using it). Install both
    # packages together from the repo root instead, see README below.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
