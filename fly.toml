app = "passthebot-api"
primary_region = "fra"

[build]
  dockerfile = "web/backend/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "15s"
    grace_period = "30s"
    method = "GET"
    path = "/docs"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
